<script>
const KEY='prestige_darts_final_v3';
const DEFAULT_PLAYERS=['Ross','Dan','Josh','Asif','Paul'];
let players=DEFAULT_PLAYERS.slice();
let state=load();
let counter={mode:501,p1:'Josh',p2:'Dan',s1:501,s2:501,turn:0,history:[],started:false};
let counterMatch=null;
let pendingScore='';

function pairId(a,b){return [a,b].sort().join('::')}
function fixtures(){
  const f=[];
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++)f.push({id:pairId(players[i],players[j]),a:players[i],b:players[j]});
  return f;
}
function mondayKey(d=new Date()){
  const x=new Date(d); const day=x.getDay(); const diff=day===0?-6:1-day; x.setHours(0,0,0,0); x.setDate(x.getDate()+diff);
  return x.toISOString().slice(0,10);
}
function dateKey(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10)}
function freshState(){const today=dateKey();return {players:players.slice(),fixtures:fixtures(),results:[],dailyResults:[],dailyDate:today,live:null,weekId:mondayKey(),archive:[],championshipHistory:[],dailyHistory:{},selectedDay:today,tournament:null,dartMatches:[]}}
function load(){
  try{
    const raw=localStorage.getItem(KEY); const s=raw?JSON.parse(raw):null;
    if(s?.players?.length) players=s.players.slice();
    if(!s)return freshState();
    const currentWeek=mondayKey(),today=dateKey();
    s.players=players.slice();
    s.fixtures=fixtures();
    s.results=Array.isArray(s.results)?s.results:[];
    s.dailyResults=Array.isArray(s.dailyResults)?s.dailyResults:[];
    s.dailyHistory=s.dailyHistory||{};
    s.dailyDate=s.dailyDate||today;
    s.archive=Array.isArray(s.archive)?s.archive:[];
    s.championshipHistory=Array.isArray(s.championshipHistory)?s.championshipHistory:[];
    s.dartMatches=Array.isArray(s.dartMatches)?s.dartMatches:[];
    s.weekId=s.weekId||currentWeek;
    if(s.weekId!==currentWeek){
      if(s.results.length)s.archive.push({weekId:s.weekId,results:s.results.slice(),fixtures:s.fixtures.slice(),savedAt:new Date().toISOString()});
      s.results=[]; s.dailyResults=[]; s.dailyDate=today; s.live=null; s.fixtures=fixtures(); s.tournament=null; s.weekId=currentWeek; s.dailyHistory={};
    }else if(s.dailyDate!==today){
      if(s.dailyDate && s.dailyResults?.length)s.dailyHistory[s.dailyDate]=s.dailyResults.slice();
      s.dailyResults=[]; s.dailyDate=today; s.live=null; s.selectedDay=today;
    }
    if(!s.selectedDay)s.selectedDay=today;
    return s;
  }catch(e){return freshState()}
}
function save(){state.players=players.slice();localStorage.setItem(KEY,JSON.stringify(state))}

function weeklyPositions(){
  return standings().map((r,i)=>({player:r.n,position:i+1,points:r.pts,wins:r.w,played:r.p}));
}
function finalizeWeekIfDue(){
  const now=new Date(), day=now.getDay(), hour=now.getHours();
  if(day!==5 || hour<17) return;
  state.championshipHistory=state.championshipHistory||[];
  const positions=weeklyPositions();
  if(!positions.length || !state.results.length) return;
  const existing=state.championshipHistory.find(x=>x.weekId===state.weekId);
  if(existing){
    existing.completedAt=existing.completedAt||now.toISOString();
    existing.champion=positions[0]?.player||null;
    existing.positions=positions;
  }else{
    state.championshipHistory.push({weekId:state.weekId,completedAt:now.toISOString(),champion:positions[0]?.player||null,positions});
  }
  save();
}
function positionRecord(name){
  const history=state.championshipHistory||[];
  const counts={};
  history.forEach(w=>(w.positions||[]).forEach(p=>{
    if(p.player===name) counts[p.position]=(counts[p.position]||0)+1;
  }));
  return counts;
}
function medalCount(name,pos){return (positionRecord(name)[pos]||0)}
function renderLeagueHistory(){
  const v=document.getElementById('view');v.className='show';
  const history=(state.championshipHistory||[]).slice().reverse();
  const totals=players.map(p=>{
    const c=positionRecord(p);
    return {p,gold:c[1]||0,silver:c[2]||0,bronze:c[3]||0};
  }).filter(x=>x.gold||x.silver||x.bronze||history.some(w=>(w.positions||[]).some(q=>q.player===x.p)));
  v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="renderLeagueView();return false">‹ BACK</button><h1>🏆 LEAGUE HISTORY</h1><span></span></div>
  <p class="small">Every completed Monday–Friday league is kept here. Friday's final standings are recorded from 5 PM onward. Saturday's reset does not erase this history.</p>
  <h3>MEDAL RECORD</h3>
  ${totals.length?totals.map(x=>`<div class="game"><b>${escapeHtml(x.p)}</b><span>🥇 ${x.gold} &nbsp; 🥈 ${x.silver} &nbsp; 🥉 ${x.bronze}</span></div>`).join(''):'<p class="small">No completed leagues yet.</p>'}
  <h3>WEEK-BY-WEEK FINISHES</h3>
  ${history.length?history.map((w,i)=>`<div class="historyCard"><b>WEEK ${history.length-i} • ${escapeHtml(w.weekId)}</b><div class="small" style="margin-top:6px">${(w.positions||[]).map(p=>`${p.position===1?'🥇':p.position===2?'🥈':p.position===3?'🥉':p.position+'️⃣'} ${escapeHtml(p.player)} — ${p.points} pts`).join('<br>')}</div></div>`).join(''):'<p class="small">No completed weeks have been recorded yet.</p>'}
  </div>`;
}
function ensureCurrentDay(){const today=dateKey(); if(state.dailyDate!==today){state.dailyHistory=state.dailyHistory||{}; if(state.dailyDate&&state.dailyResults?.length)state.dailyHistory[state.dailyDate]=state.dailyResults.slice(); state.dailyResults=[];state.dailyDate=today;state.selectedDay=today;state.live=null;save();} const cw=mondayKey(); if(state.weekId!==cw){ if(state.results.length)state.archive.push({weekId:state.weekId,results:state.results.slice(),fixtures:state.fixtures.slice(),savedAt:new Date().toISOString()}); state.results=[];state.dailyResults=[];state.dailyDate=today;state.live=null;state.fixtures=fixtures();state.tournament=null;state.weekId=cw;save(); } finalizeWeekIfDue(); }
function remaining(){ensureCurrentDay();const done=new Set(state.dailyResults.map(r=>r.id));return state.fixtures.filter(f=>!done.has(f.id))}
function allLeagueResults(){ensureCurrentDay();return state.results||[]}
function current(){return state.live?state.fixtures.find(f=>f.id===state.live.id):null}
function startGame(id){ensureCurrentDay();if(state.live)return;const f=state.fixtures.find(x=>x.id===id);if(!f)return;if(state.dailyResults.some(r=>r.id===id))return;state.live={id,s1:0,s2:0,startedAt:new Date().toISOString()};save();renderHome()}
function addScore(side){if(!state.live)return;if(side===0)state.live.s1=(state.live.s1||0)+1;else state.live.s2=(state.live.s2||0)+1;save();renderHome()}
function finishCurrent(side){
  ensureCurrentDay(); const f=current(); if(!f)return;
  const s1=Number(state.live.s1)||0,s2=Number(state.live.s2)||0,createdAt=new Date().toISOString();
  const result={id:f.id,a:f.a,b:f.b,winner:side===0?f.a:f.b,s1,s2,createdAt,date:state.dailyDate};
  state.results.push(result); state.dailyResults.push(result); state.selectedDay=state.dailyDate;
  state.live=null; finalizeWeekIfDue(); save(); renderHome();
}
function resultMatches(r,id,date){return !!r && r.id===id && String(r.date||'')===String(date||'')}
function getResult(id,date){
  return (state.results||[]).find(r=>resultMatches(r,id,date)) ||
    (date===state.dailyDate?(state.dailyResults||[]).find(r=>resultMatches(r,id,date)):null) ||
    (state.dailyHistory?.[date]||[]).find(r=>resultMatches(r,id,date)) || null;
}
function updateResultEverywhere(corrected){
  state.results=(state.results||[]).map(r=>resultMatches(r,corrected.id,corrected.date)?corrected:r);
  if(String(corrected.date||'')===String(state.dailyDate||'')) state.dailyResults=(state.dailyResults||[]).map(r=>resultMatches(r,corrected.id,corrected.date)?corrected:r);
  if(state.dailyHistory?.[corrected.date]) state.dailyHistory[corrected.date]=state.dailyHistory[corrected.date].map(r=>resultMatches(r,corrected.id,corrected.date)?corrected:r);
}
function removeResultEverywhere(target){
  state.results=(state.results||[]).filter(r=>!resultMatches(r,target.id,target.date));
  if(String(target.date||'')===String(state.dailyDate||'')) state.dailyResults=(state.dailyResults||[]).filter(r=>!resultMatches(r,target.id,target.date));
  if(state.dailyHistory?.[target.date]) state.dailyHistory[target.date]=state.dailyHistory[target.date].filter(r=>!resultMatches(r,target.id,target.date));
}
function editResultByKey(id,date,returnView='league'){
  const r=getResult(id,date); if(!r)return;
  const oldWinner=r.winner,oldS1=Number(r.s1)||0,oldS2=Number(r.s2)||0;
  const s1=Number(prompt(`${r.a}'s corrected final score`,oldS1));
  const s2=Number(prompt(`${r.b}'s corrected final score`,oldS2));
  if(!Number.isFinite(s1)||!Number.isFinite(s2)||s1<0||s2<0||!Number.isInteger(s1)||!Number.isInteger(s2)){alert('Please enter whole-number scores of 0 or more.');return}
  if(s1===s2){alert('A corrected result must have a winner. Please enter different scores.');return}
  const winner=s1>s2?r.a:r.b;

function openPlayerProfile(name){
  if(!players.includes(name))return;const v=document.getElementById('view');v.className='show';const s=playerStats(name),recent=state.results.filter(r=>r.a===name||r.b===name).slice().reverse().slice(0,8);v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>👤 ${escapeHtml(name)}</h1><span></span></div><div class="small">PLAYER PROFILE • CURRENT WEEK / SEASON</div><div class="profileGrid"><div class="profileStat"><small>GAMES PLAYED (WEEK)</small><b>${s.played}</b></div><div class="profileStat"><small>POINTS</small><b>${s.points}</b></div><div class="profileStat"><small>WINS</small><b>${s.wins}</b></div><div class="profileStat"><small>LOSSES</small><b>${s.losses}</b></div><div class="profileStat"><small>WIN RATE</small><b>${s.winRate}%</b></div><div class="profileStat"><small>HIGHEST SCORE</small><b>${s.highestScore}</b></div><div class="profileStat"><small>3-DART AVERAGE</small><b>${s.dart.avg||'—'}</b></div><div class="profileStat"><small>FIRST 9 AVG</small><b>${s.dart.first9||'—'}</b></div><div class="profileStat"><small>HIGHEST CHECKOUT</small><b>${s.dart.highestCheckout||'—'}</b></div><div class="profileStat"><small>180s</small><b>${s.dart.oneEighty}</b></div><div class="profileStat"><small>CHECKOUT %</small><b>${s.dart.checkoutAttempts?Math.round(s.dart.checkoutHits/s.dart.checkoutAttempts*100)+'%':'—'}</b></div><div class="profileStat"><small>SEASON GAMES</small><b>${s.seasonPlayed}</b></div><div class="profileStat"><small>SEASON WINS</small><b>${s.seasonWins}</b></div><div class="profileStat"><small>SEASON POINTS</small><b>${s.seasonPoints}</b></div></div><h3>LEAGUE FINISH HISTORY</h3>${(state.championshipHistory||[]).length?(state.championshipHistory.slice().reverse().map((w,i)=>{const q=(w.positions||[]).find(p=>p.player===name);return q?`<div class="resultRow"><span>Week ${escapeHtml(w.weekId)}</span><b>${q.position===1?'🥇 1ST':q.position===2?'🥈 2ND':q.position===3?'🥉 3RD':q.position+'TH'} • ${q.points} pts</b></div>`:''}).join('')||'<p class="small">No finishing positions recorded yet.</p>'):'<p class="small">No finishing positions recorded yet.</p>'}<h3>RECENT RESULTS</h3>${recent.length?recent.map(r=>{const opp=r.a===name?r.b:r.a,won=r.winner===name,score=r.a===name?`${r.s1||0} - ${r.s2||0}`:`${r.s2||0} - ${r.s1||0}`;return `<div class="resultRow"><span>vs ${escapeHtml(opp)}</span><b>${won?'WIN':'LOSS'} • ${score}${r.edited?' • EDITED':''}</b></div>`}).join(''):'<p class="small">No completed games yet.</p>'}</div>`;
}
function renderPlayers(){const v=document.getElementById('view');v.className='show';const s=stats();v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>👥 MANAGE PLAYERS</h1><span></span></div><p class="small">Add players to the league, edit names, or remove a player. Removing a player also removes their fixtures and results.</p><div class="controls"><button class="redAction" onclick="addPlayer();return false">＋ ADD PLAYER</button></div>${players.map((p,i)=>`<div class="game"><div><b class="clickPlayer" onclick="openPlayerProfile('${escapeHtml(p)}');return false">${escapeHtml(p)}</b><div class="small">${s[p].p} games • ${s[p].pts} points</div></div><div class="controls"><button class="ghost" onclick="editPlayer(${i});return false">EDIT</button><button class="action" onclick="removePlayer(${i});return false">REMOVE</button></div></div>`).join('')}</div>`}
function addPlayer(){const name=(prompt('Player name?')||'').trim();if(!name)return;if(players.some(p=>p.toLowerCase()===name.toLowerCase())){alert('That player already exists.');return}players.push(name);state.fixtures=fixtures();save();renderPlayers();renderHome()}
function editPlayer(i){
  const old=players[i],name=(prompt('Edit player name:',old)||'').trim();
  if(!name||name===old)return;
  if(players.some((p,j)=>j!==i&&p.toLowerCase()===name.toLowerCase())){alert('That player already exists.');return}
  players[i]=name;
  state.fixtures=state.fixtures.map(f=>{const a=f.a===old?name:f.a,b=f.b===old?name:f.b;return{id:pairId(a,b),a,b}});
  state.results=state.results.map(r=>{const a=r.a===old?name:r.a,b=r.b===old?name:r.b;return{...r,a,b,winner:r.winner===old?name:r.winner,id:pairId(a,b)}});
  state.archive=(state.archive||[]).map(a=>({...a,results:(a.results||[]).map(r=>{const aa=r.a===old?name:r.a,bb=r.b===old?name:r.b;return{...r,a:aa,b:bb,winner:r.winner===old?name:r.winner,id:pairId(aa,bb)}})}));
  state.dartMatches=(state.dartMatches||[]).map(m=>{const p1=m.p1===old?name:m.p1,p2=m.p2===old?name:m.p2,st={...(m.stats||{})};if(m.stats?.[old]){st[name]=m.stats[old];delete st[old]}return{...m,p1,p2,winner:m.winner===old?name:m.winner,stats:st}});
  if(state.tournament){state.tournament.selected=(state.tournament.selected||[]).map(p=>p===old?name:p);state.tournament.players=(state.tournament.players||[]).map(p=>p===old?name:p)}
  save();renderPlayers();renderHome();
}
function removePlayer(i){const name=players[i];if(!confirm(`Remove ${name}? This will remove their fixtures and results.`))return;players.splice(i,1);state.results=state.results.filter(r=>r.a!==name&&r.b!==name);state.fixtures=fixtures();state.live=null;save();renderPlayers();renderHome()}
function renderLeagueView(){
  const v=document.getElementById('view');v.className='show'; const rows=standings();
  const results=(state.results||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  v.innerHTML=`<div class=\"panel\"><div class=\"viewHead\"><button class=\"ghost\" onclick=\"goHome();return false\">‹ BACK</button><h1>🏆 LEAGUE TABLE</h1><span></span></div>${results.some(r=>r.edited)?'<div class=\"correctionNotice\">✏️ <b>RESULT CORRECTED</b> — the standings below include all score changes.</div>':''}<div class=\"controls\"><button class=\"goldAction\" onclick=\"renderLeagueHistory();return false\">🏆 LEAGUE HISTORY / HALL OF FAME</button></div><div class=\"tableScroll\"><table class=\"liveTable\"><thead><tr><th>#</th><th>PLAYER</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class=\"rank ${i<3?'medal':''}\">${i<3?["🥇","🥈","🥉"][i]:i+1}</span></td><td><b class=\"clickPlayer\" onclick=\"openPlayerProfile('${escapeHtml(r.n)}');return false\">${escapeHtml(r.n)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class=\"pts\">${r.pts}</td></tr>`).join('')}</tbody></table></div><h3>PREVIOUS RESULTS</h3>${results.length?results.map(r=>`<div class=\"game\"><div><b>${escapeHtml(r.a)} vs ${escapeHtml(r.b)}</b><div class=\"small\">${escapeHtml(r.winner)} won • ${r.s1||0} - ${r.s2||0}${r.date?` • ${escapeHtml(r.date)}`:''}${r.edited?` • ✏️ CORRECTED (${r.previousS1??0}-${r.previousS2??0} → ${r.s1||0}-${r.s2??0})`:''}</div></div><div class=\"controls\"><button class=\"ghost\" onclick='editResultByKey(${JSON.stringify(r.id)},${JSON.stringify(r.date||'')});return false'>EDIT</button><button class=\"action\" onclick='deleteResultByKey(${JSON.stringify(r.id)},${JSON.stringify(r.date||'')});return false'>DELETE</button></div></div>`).join(''):'<p class=\"small\">No completed games yet.</p>'}</div>`;
}

function weekDates(){
  const base=new Date(state.weekId+'T12:00:00');
  const day=base.getDay(); const mondayOffset=day===0?-6:1-day; base.setDate(base.getDate()+mondayOffset);
  const out=[]; for(let i=0;i<5;i++){const d=new Date(base);d.setDate(base.getDate()+i);out.push(dateKeyFrom(d));} return out;
}
function dateKeyFrom(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dayName(k){return new Date(k+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'});}
function dayResults(k){ensureCurrentDay(); if(k===state.dailyDate)return state.dailyResults||[]; return (state.dailyHistory||{})[k]||[];}
function dayRemaining(k){const results=dayResults(k);const done=new Set(results.map(r=>r.id));return state.fixtures.filter(f=>!done.has(f.id)).length;}
function selectLeagueDay(k){state.selectedDay=k;save();openView('today');}
function renderTodayDay(){
  ensureCurrentDay();
  const selected=state.selectedDay||state.dailyDate; const dates=weekDates();
  const currentWeekDay=dates.includes(selected)?selected:state.dailyDate; const results=dayResults(currentWeekDay);
  const isCurrent=currentWeekDay===state.dailyDate; const v=document.getElementById('view');v.className='show';
  let html=`<div class=\"panel\"><div class=\"viewHead\"><button class=\"back\" onclick=\"goHome();return false\">‹ BACK</button><h1>🎯 TODAY'S GAMES</h1><span></span></div>
  <div class=\"dayPicker\">${dates.map(d=>`<button class=\"${d===currentWeekDay?'selectedDay':''}\" onclick=\"selectLeagueDay('${d}');return false\">${dayName(d).slice(0,3)}<small>${d.slice(8,10)}</small></button>`).join('')}</div>
  <p class=\"small\"><b>${dayName(currentWeekDay)}</b> — ${isCurrent?'current day':'previous day'} • <b>${dayRemaining(currentWeekDay)} remaining</b></p>`;
  if(isCurrent && state.live){const f=current();if(f)html+=`<div class=\"game\"><b>🔴 LIVE — ${escapeHtml(f.a)} vs ${escapeHtml(f.b)}</b><div class=\"controls\"><button class=\"action\" onclick=\"finishCurrent(0)\">🏆 ${escapeHtml(f.a)} WINS</button><button class=\"action\" onclick=\"finishCurrent(1)\">🏆 ${escapeHtml(f.b)} WINS</button></div></div>`;}
  html+=state.fixtures.map(g=>{const r=results.find(x=>x.id===g.id); if(r)return `<div class=\"game\"><div><b>${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><div class=\"small\">✅ ${r.s1||0} - ${r.s2||0} • ${escapeHtml(r.winner)} won${r.edited?' • ✏️ CORRECTED':''}</div></div><button class=\"ghost\" onclick='editResultByKey(${JSON.stringify(r.id)},${JSON.stringify(r.date||currentWeekDay)},'today');return false'>EDIT</button></div>`; if(isCurrent)return `<div class=\"game\"><b>${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><button class=\"action\" onclick=\"startGame('${escapeHtml(g.id)}')\">START</button></div>`; return `<div class=\"game\"><b>${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><span>Not played</span></div>`;}).join('') || '<p class=\"small\">No fixtures available.</p>';
  html+='</div>'; v.innerHTML=html;
}
function openView(type){
  if(type==='tournament'){renderTournament();return} if(type==='counter'){counter.started=false;pendingScore='';renderCounter();return} if(type==='league'){renderLeagueView();return} if(type==='players'){renderPlayers();return}
  const v=document.getElementById('view');v.className='show';let title=type==='today'?'🎯 TODAY\'S GAMES':type==='week'?'📅 FULL WEEK':'📋 RULES';let html=`<div class="panel"><div class="viewHead"><button class="back" onclick="goHome();return false" onpointerup="goHome();return false">‹ BACK</button><h1>${title}</h1><span></span></div>`;
  if(type==='today'){renderTodayDay();return;} 
  else if(type==='week'){html+=`<p class="small">League week: Monday to Friday. Today's fixtures reset each day, while league points accumulate until Saturday morning.</p>`+state.fixtures.map((g,i)=>{const r=state.results.find(x=>x.id===g.id);const live=state.live?.id===g.id;return `<div class="game"><b>${i+1}. ${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><span>${live?'🔴 LIVE':r?'Complete':'Not played'}</span></div>`}).join('')+`<h3>ARCHIVED WEEKS</h3>`+(state.archive.length?state.archive.slice().reverse().map(a=>`<div class="game"><b>Week starting ${escapeHtml(a.weekId)}</b><span>${a.results.length} results</span></div>`).join(''):'<p class="small">No previous weeks archived yet.</p>')}
  else html+=`<p class="small"><b>League format</b><br>Each fixture is one game — there are no legs. The winner receives 2 league points and the loser receives 0.</p><p class="small"><b>Weekly cycle</b><br>Today's games reset at the start of each new day. League points accumulate Monday to Friday and stay visible through Friday. On Saturday morning the completed week is archived and the league resets to 0–0 ready for Monday.</p><p class="small"><b>League history</b><br>Friday's final standings are recorded from 5 PM onward. Every player's finishing position is kept, with permanent gold, silver and bronze totals.</p><p class="small"><b>Corrections</b><br>Previous results can be edited or deleted from the League Table screen, and the standings recalculate automatically.</p>`;
  html+='</div>';v.innerHTML=html;
}
function goHome(){document.getElementById('view').className='';renderHome()}
renderHome();
</script>
