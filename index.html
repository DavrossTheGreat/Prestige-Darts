<body>

  <div id="tableOverlay">

    <tr><td><span class="rank medal">🥉</span></td><td><b>Josh</b></td><td>0</td><td>0</td><td>0</td><td>0</td><td class="pts">0</td></tr>

  <button class="homeFeature" id="week" onclick="openView('week');return false">📅<span>FULL WEEK<small>VIEW ALL FIXTURES</small></span></button>

<script>
const KEY='prestige_darts_final_v2';
const DEFAULT_PLAYERS=['Ross','Dan','Josh','Asif','Paul'];
let players=DEFAULT_PLAYERS.slice();
let state=load();
let counter={mode:501,p1:'Josh',p2:'Dan',s1:501,s2:501,turn:0,history:[],started:false};
let counterMatch=null;
let pendingScore='';

function pairId(a,b){return [a,b].sort().join('::')}
function fixtures(){
  const f=[];
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++)f.push({id:pairId(players[i],players[j]),a:players[i],b:players[j]});
  return f;
}
function mondayKey(d=new Date()){
  const x=new Date(d); const day=x.getDay(); const diff=day===0?-6:1-day; x.setHours(0,0,0,0); x.setDate(x.getDate()+diff);
  return x.toISOString().slice(0,10);
}
function dateKey(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10)}
function freshState(){const today=dateKey();return {players:players.slice(),fixtures:fixtures(),results:[],dailyResults:[],dailyDate:today,live:null,weekId:mondayKey(),archive:[],tournament:null,dartMatches:[]}}
function load(){
  try{
    const raw=localStorage.getItem(KEY); const s=raw?JSON.parse(raw):null;
    if(s?.players?.length) players=s.players.slice();
    if(!s)return freshState();
    const currentWeek=mondayKey(),today=dateKey();
    s.players=players.slice(); s.fixtures=s.fixtures?.length?s.fixtures:fixtures(); s.results=s.results||[]; s.dailyResults=s.dailyResults||[]; s.dailyDate=s.dailyDate||today; s.archive=s.archive||[]; s.dartMatches=s.dartMatches||[];
    if(s.weekId && s.weekId!==currentWeek){
      if(s.results.length)s.archive.push({weekId:s.weekId,results:s.results.slice(),fixtures:s.fixtures.slice(),savedAt:new Date().toISOString()});
      s.results=[]; s.dailyResults=[]; s.dailyDate=today; s.live=null; s.fixtures=fixtures(); s.tournament=null; s.weekId=currentWeek;
    }else if(s.dailyDate!==today){
      // New calendar day: keep weekly league results, but start today's fixtures fresh.
      s.dailyResults=[]; s.dailyDate=today; s.live=null;
    }
    if(!s.weekId)s.weekId=currentWeek;
    if(!s.dailyDate)s.dailyDate=today;
    return s;
  }catch(e){return freshState()}
}
function save(){state.players=players.slice();localStorage.setItem(KEY,JSON.stringify(state))}
function ensureCurrentDay(){const today=dateKey(); if(state.dailyDate!==today){state.dailyResults=[];state.dailyDate=today;state.live=null;save();} const cw=mondayKey(); if(state.weekId!==cw){ if(state.results.length)state.archive.push({weekId:state.weekId,results:state.results.slice(),fixtures:state.fixtures.slice(),savedAt:new Date().toISOString()}); state.results=[];state.dailyResults=[];state.dailyDate=today;state.live=null;state.fixtures=fixtures();state.tournament=null;state.weekId=cw;save(); }}
function remaining(){ensureCurrentDay();const done=new Set(state.dailyResults.map(r=>r.id));return state.fixtures.filter(f=>!done.has(f.id))}
function allLeagueResults(){ensureCurrentDay();return state.results||[]}
function current(){return state.live?state.fixtures.find(f=>f.id===state.live.id):null}
function startGame(id){ensureCurrentDay();if(state.live)return;const f=state.fixtures.find(x=>x.id===id);if(!f)return;if(state.dailyResults.some(r=>r.id===id))return;state.live={id,s1:0,s2:0,startedAt:new Date().toISOString()};save();renderHome()}
function addScore(side){if(!state.live)return;if(side===0)state.live.s1=(state.live.s1||0)+1;else state.live.s2=(state.live.s2||0)+1;save();renderHome()}
function finishCurrent(side){
  ensureCurrentDay(); const f=current(); if(!f)return;
  const s1=Number(state.live.s1)||0,s2=Number(state.live.s2)||0,createdAt=new Date().toISOString();
  const result={id:f.id,a:f.a,b:f.b,winner:side===0?f.a:f.b,s1,s2,createdAt,date:state.dailyDate};
  state.results.push(result); state.dailyResults.push(result);
  state.live=null; save(); renderHome();
}
function editResult(index){
  const r=state.results[index];if(!r)return;
  const oldWinner=r.winner,oldS1=Number(r.s1)||0,oldS2=Number(r.s2)||0;
  const s1=Number(prompt(`${r.a}'s corrected final score`,oldS1));
  const s2=Number(prompt(`${r.b}'s corrected final score`,oldS2));
  if(!Number.isFinite(s1)||!Number.isFinite(s2)||s1<0||s2<0||!Number.isInteger(s1)||!Number.isInteger(s2)){alert('Please enter whole-number scores of 0 or more.');return}
  if(s1===s2){alert('A corrected result must have a winner. Please enter different scores.');return}
  const winner=s1>s2?r.a:r.b;
  const changed=s1!==oldS1||s2!==oldS2||winner!==oldWinner;
  if(!changed){alert('No change was made.');return}
  const corrected={...r,winner,s1,s2,edited:true,editedAt:new Date().toISOString(),previousWinner:oldWinner,previousS1:oldS1,previousS2:oldS2};
  state.results[index]=corrected;
  const di=state.dailyResults.findIndex(x=>x.id===r.id && x.date===(r.date||state.dailyDate));
  if(di>=0)state.dailyResults[di]=corrected;
  save();renderLeagueView();renderHome();
  alert(`Result corrected: ${r.a} ${oldS1}-${oldS2} ${r.b} → ${r.a} ${s1}-${s2} ${r.b}.\n\nThe league table has been recalculated.`);
}
function deleteResult(index){if(!confirm('Delete this result? The fixture will become unplayed today.'))return;const r=state.results[index];state.results.splice(index,1);const di=state.dailyResults.findIndex(x=>x.id===r?.id && x.date===(r?.date||state.dailyDate));if(di>=0)state.dailyResults.splice(di,1);save();renderLeagueView();renderHome()}
function stats(){
  const s={};players.forEach(p=>s[p]={p:0,w:0,d:0,l:0,pts:0});
  for(const r of state.results){if(!s[r.a]||!s[r.b])continue;s[r.a].p++;s[r.b].p++;
    if(r.winner===r.a){s[r.a].w++;s[r.a].pts+=2;s[r.b].l++}else if(r.winner===r.b){s[r.b].w++;s[r.b].pts+=2;s[r.a].l++}else{s[r.a].d++;s[r.b].d++}
  }return s;
}
function standings(){const s=stats();return players.map(n=>({n,...s[n]})).sort((a,b)=>b.pts-a.pts||b.w-a.w||b.p-a.p||a.n.localeCompare(b.n))}
function renderHome(){
  ensureCurrentDay();
  const nr=document.getElementById('nextRemaining'); if(nr){const left=remaining().length; nr.textContent=`${left} remaining`;}
  const f=current(),ov=document.getElementById('scoreOverlay'),meta=document.getElementById('liveMeta'),wl=document.getElementById('winLeft'),wr=document.getElementById('winRight');
  if(f){ov.style.display='flex';meta.style.display='block';meta.textContent='MATCH IN PROGRESS';document.getElementById('p1').textContent=f.a;document.getElementById('p2').textContent=f.b;document.getElementById('s1').textContent=state.live.s1||0;document.getElementById('s2').textContent=state.live.s2||0;document.getElementById('s1').classList.add('liveTap');document.getElementById('s2').classList.add('liveTap');wl.style.display='block';wr.style.display='block'}
  else{ov.style.display='none';meta.style.display='none';wl.style.display='none';wr.style.display='none';document.getElementById('s1').classList.remove('liveTap');document.getElementById('s2').classList.remove('liveTap')}
  const rows=standings(),table=document.getElementById('tableOverlay');
  table.innerHTML=`<div class="thead"><span class="title">LEAGUE TABLE (LIVE) <span class="green">●</span></span><span class="time">UPDATED ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><table class="liveTable"><thead><tr><th>#</th><th>PLAYER</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class="rank ${i<3?'medal':''}">${i<3?["🥇","🥈","🥉"][i]:i+1}</span></td><td><b class="clickPlayer" onclick="openPlayerProfile('${escapeHtml(r.n)}');return false">${escapeHtml(r.n)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table>`;
}
function escapeHtml(x){return String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function startNext(index){if(state.live){openView('today');return}const games=remaining();if(games[index])startGame(games[index].id)}

function selectedTournamentPlayers(){return state.tournament?.selected||[]}
function toggleTournamentPlayer(name){
  state.tournament=state.tournament||{selected:[]}; const a=state.tournament.selected||[]; const i=a.indexOf(name); if(i>=0)a.splice(i,1);else a.push(name); state.tournament.selected=a; save(); renderTournament();
}
function seedOrder(){const st=standings();const selected=selectedTournamentPlayers();return selected.slice().sort((a,b)=>st.findIndex(x=>x.n===a)-st.findIndex(x=>x.n===b))}
function buildBracket(){
  const p=seedOrder();
  if(p.length<4){alert('Select at least 4 players.');return}
  if(p.length>8){alert('Select no more than 8 players.');return}
  const t={selected:p.slice(),started:true,players:p.slice(),matches:{qf:[],sf:[{a:null,b:null,winner:null},{a:null,b:null,winner:null}],final:{a:null,b:null,winner:null}},champion:null};
  if(p.length===4)t.matches.sf=[{a:p[0],b:p[3],winner:null},{a:p[1],b:p[2],winner:null}];
  else if(p.length===5){t.matches.qf=[{a:p[3],b:p[4],winner:null}];t.matches.sf=[{a:p[0],b:null,winner:null},{a:p[1],b:p[2],winner:null}];}
  else if(p.length===6){t.matches.qf=[{a:p[2],b:p[5],winner:null},{a:p[3],b:p[4],winner:null}];t.matches.sf=[{a:p[0],b:null,winner:null},{a:p[1],b:null,winner:null}];}
  else if(p.length===7){t.matches.qf=[{a:p[2],b:p[6],winner:null},{a:p[3],b:p[5],winner:null}];t.matches.sf=[{a:p[0],b:null,winner:null},{a:p[1],b:p[4],winner:null}];}
  else{t.matches.qf=[{a:p[0],b:p[7],winner:null},{a:p[3],b:p[4],winner:null},{a:p[1],b:p[6],winner:null},{a:p[2],b:p[5],winner:null}];}
  state.tournament=t;save();renderTournament();
}
function tournamentPlayable(round,i){const t=state.tournament?.matches;if(!t)return false;const m=round==='qf'?t.qf[i]:round==='sf'?t.sf[i]:[t.final][0];return !!(m&&m.a&&m.b&&!m.winner)}
function startTournamentMatch(round,i=0){const t=state.tournament?.matches;if(!t)return;const m=round==='qf'?t.qf[i]:round==='sf'?t.sf[i]:t.final;if(!m||!m.a||!m.b||m.winner)return;counterMode(501,m.a,m.b,{round,index:i,tournament:true})}
function finishCounterMatch(side){
  const winner=side===0?counter.p1:counter.p2,dartSummary={};
  [counter.p1,counter.p2].forEach((name,idx)=>{
    const h=counter.history.filter(x=>x.player===idx),attempts=h.filter(x=>x.checkoutAttempt).length,hits=h.filter(x=>x.checkout).length;
    dartSummary[name]={visits:h.length,points:h.reduce((a,x)=>a+(x.score||0),0),highestScore:h.reduce((m,x)=>Math.max(m,x.score||0),0),highestCheckout:h.filter(x=>x.checkout).reduce((m,x)=>Math.max(m,x.score||0),0),oneEighty:h.filter(x=>x.score===180).length,checkoutAttempts:attempts,checkoutHits:hits,first9Points:h.slice(0,3).reduce((a,x)=>a+(x.score||0),0),first9Visits:Math.min(3,h.length)};
  });
  state.dartMatches=state.dartMatches||[];
  state.dartMatches.push({date:new Date().toISOString(),p1:counter.p1,p2:counter.p2,winner,mode:counter.mode,stats:dartSummary,tournament:!!counterMatch?.tournament});
  if(counterMatch?.tournament){
    const ctx=counterMatch,t=state.tournament?.matches,m=ctx.round==='qf'?t.qf[ctx.index]:ctx.round==='sf'?t.sf[ctx.index]:t.final;
    if(!m||m.winner){counterMatch=null;counter.started=false;pendingScore='';renderTournament();return}
    m.winner=winner;
    if(ctx.round==='qf'){
      if(t.qf.length===1)t.sf[0].b=winner;
      else if(t.qf.length===2){if(ctx.index===0)t.sf[0].b=winner;else t.sf[1].a=winner}
      else if(t.qf.length===4){if(ctx.index===0)t.sf[0].b=winner;else if(ctx.index===1)t.sf[0].a=winner;else if(ctx.index===2)t.sf[1].b=winner;else t.sf[1].a=winner}
    }else if(ctx.round==='sf'){if(ctx.index===0)t.final.a=winner;else t.final.b=winner}
    else t.champion=winner;
    save();counterMatch=null;counter.started=false;pendingScore='';renderTournament();return;
  }
  counter.started=false;pendingScore='';save();renderCounter();
}
function renderTournament(){
  const v=document.getElementById('view');v.className='show'; const t=state.tournament||{selected:[],started:false};
  if(!t.started){const selected=t.selected||[];v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>🏆 TOURNAMENT</h1><span></span></div><p class="small">Select the players who will enter the knockout. They disappear from the available list when selected. Seeding follows the current league table.</p><h3>AVAILABLE PLAYERS</h3><div class="gameSelect">${players.filter(p=>!selected.includes(p)).map(p=>`<button class="modeBtn" onclick="toggleTournamentPlayer('${escapeHtml(p)}');return false">＋ ${escapeHtml(p)}</button>`).join('')||'<p class="small">Everyone is selected.</p>'}</div><h3>SELECTED PLAYERS (${selected.length})</h3><div class="gameSelect">${selected.map(p=>`<button class="modeBtn active" onclick="toggleTournamentPlayer('${escapeHtml(p)}');return false">✓ ${escapeHtml(p)}</button>`).join('')||'<p class="small">No players selected yet.</p>'}</div><div class="controls"><button class="goldAction" onclick="buildBracket();return false">🏆 START TOURNAMENT</button></div></div>`;return}
  const m=t.matches; const qf=m.qf||[],sf=m.sf||[],fin=m.final||{};
  v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>🏆 TOURNAMENT</h1><span></span></div><p class="small">Knockout bracket • seeded from the selected league players.</p><div class="bracketWrap"><div class="bracket"><div class="round"><div><div class="roundTitle">QUARTER-FINAL</div>${qf.map((x,i)=>matchCard(x,'qf',i)).join('')}</div></div><div class="round"><div><div class="roundTitle">SEMI-FINAL</div>${sf.map((x,i)=>matchCard(x,'sf',i)).join('')}</div></div><div class="round"><div><div class="roundTitle">FINAL</div>${matchCard(fin,'final',0,true)}</div></div><div class="round"><div><div class="roundTitle">CHAMPION</div><div class="champion"><div class="cup">🏆</div><div class="championName">${escapeHtml(t.champion||'TBD')}</div><div class="small">PRESTIGE TYRES CHAMPION</div></div></div></div></div></div><div class="controls"><button class="ghost" onclick="resetTournament();return false">RESET TOURNAMENT</button></div></div>`;
}
function matchCard(x,round,i,final=false){if(!x)return '';const ready=x.a&&x.b&&!x.winner;return `<div class="match ${final?'finalMatch':''}"><div class="matchTitle">${escapeHtml(x.a||'TBD')} vs ${escapeHtml(x.b||'TBD')}</div><div class="slot">${escapeHtml(x.a||'TBD')}${x.winner===x.a?' ✓':''}</div><div class="slot">${escapeHtml(x.b||'TBD')}${x.winner===x.b?' ✓':''}</div>${ready?`<button class="${final?'goldAction':'redAction'}" style="width:100%;margin-top:7px;padding:8px" onclick="startTournamentMatch('${round}',${i});return false">🎯 ${final?'PLAY FINAL':'PLAY MATCH'}</button>`:''}</div>`}
function resetTournament(){state.tournament=null;save();renderTournament()}

function counterMode(mode,p1='Josh',p2='Dan',context=null){counter={mode,p1,p2,s1:mode===301?301:501,s2:mode===301?301:501,turn:0,history:[],started:true};counterMatch=context;pendingScore='';renderCounter()}
function counterStats(){const total=[0,1].map(p=>counter.history.filter(x=>x.player===p).reduce((a,x)=>a+x.score,0));const visits=[0,1].map(p=>counter.history.filter(x=>x.player===p).length);return {total,visits,avg:[visits[0]?Math.round(total[0]/visits[0]*10)/10:0,visits[1]?Math.round(total[1]/visits[1]*10)/10:0]}}
function renderCounter(){
  const v=document.getElementById('view');v.className='show';
  if(!counter.started){v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>🎯 DART COUNTER</h1><span></span></div><p class="small">Quick scoring for matches and practice. No legs are used in league fixtures.</p><div class="gameSelect"><button class="modeBtn" onclick="counterMode(501)">🎯 501</button><button class="modeBtn" onclick="counterMode(301)">🎯 301</button><button class="modeBtn" onclick="counterMode(0)">🎯 PRACTICE</button></div></div>`;return}
  if(counter.mode===0){v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="counter.started=false;renderCounter();return false">‹ BACK</button><h1>🎯 PRACTICE</h1><span></span></div><div class="counterTop"><div class="playerCard"><div class="name">${escapeHtml(counter.p1)}</div><div class="bigScore scoreRed">${counter.s1}</div></div><div class="playerCard"><div class="name">${escapeHtml(counter.p2)}</div><div class="bigScore">${counter.s2}</div></div></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,0,25,50,100,180].map(n=>`<button onclick="counterThrow(${n});return false">${n}</button>`).join('')}</div><div class="counterActions"><button class="ghost" onclick="counterUndo();return false">↩ UNDO</button><button class="ghost" onclick="counterClear();return false">CLEAR</button><button class="redAction" onclick="counterSwitch();return false">SWITCH</button></div><div class="checkout">Practice mode • current player: <b>${counter.turn===0?escapeHtml(counter.p1):escapeHtml(counter.p2)}</b></div></div>`;return}
  const cs=counterStats(),currentPlayer=counter.turn===0?counter.p1:counter.p2,req=counter.turn===0?counter.s1:counter.s2,checkout=req>170?'No checkout':checkoutText(req);
  v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="if(counterMatch){counterMatch=null;counter.started=false;renderTournament()}else{counter.started=false;renderCounter()}return false">‹ BACK</button><h1>${counter.mode} - BEST OF 1</h1><span></span></div><div class="counterTop"><div class="playerCard"><div class="name">${escapeHtml(counter.p1)}</div><div class="bigScore scoreRed">${counter.s1}</div><div class="small">${cs.visits[0]} visits</div></div><div class="playerCard"><div class="name">${escapeHtml(counter.p2)}</div><div class="bigScore">${counter.s2}</div><div class="small">${cs.visits[1]} visits</div></div></div><div class="checkout"><b>${escapeHtml(currentPlayer).toUpperCase()} TO THROW</b><br><span class="small">Requires ${req}${checkout!=='No checkout'?` · Suggested ${checkout}`:''}</span></div><div id="pending" class="checkout" style="display:none"></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,0,25,50,100,180].map(n=>`<button onclick="counterAddDigit(${n});return false">${n}</button>`).join('')}</div><div class="counterActions"><button class="ghost" onclick="counterUndo();return false">↩ UNDO</button><button class="ghost" onclick="counterClear();return false">CLEAR</button><button class="ghost" onclick="counterBust();return false">BUST</button><button class="redAction" onclick="counterSubmit();return false">SUBMIT</button></div><div class="statGrid"><div class="stat"><small>${escapeHtml(counter.p1)} 3-DART AVG</small><b>${cs.avg[0]}</b></div><div class="stat"><small>${escapeHtml(counter.p2)} 3-DART AVG</small><b>${cs.avg[1]}</b></div></div></div>`;
}
function counterAddDigit(n){pendingScore+=String(n);const el=document.getElementById('pending');if(el){el.style.display='block';el.textContent='Visit score: '+pendingScore}}
function counterClear(){pendingScore='';const el=document.getElementById('pending');if(el){el.style.display='none';el.textContent=''}renderCounter()}
function counterUndo(){const last=counter.history.pop();if(last){if(last.player===0)counter.s1+=last.score;else counter.s2+=last.score;counter.turn=last.player}pendingScore='';renderCounter()}
function counterSwitch(){counter.turn=counter.turn===0?1:0;renderCounter()}
function counterBust(){
  if(counter.mode===0)return;
  const before=counter.turn===0?counter.s1:counter.s2;
  counter.history.push({player:counter.turn,score:0,bust:true,checkoutAttempt:before<=170});
  pendingScore='';counter.turn=counter.turn===0?1:0;renderCounter();
}
function counterThrow(n){if(counter.mode===0){if(counter.turn===0)counter.s1+=n;else counter.s2+=n;counter.history.push({player:counter.turn,score:n});counterSwitch()}}
function counterSubmit(){
  const n=Number(pendingScore);
  if(!Number.isFinite(n)||n<0||n>180){alert('Enter a score from 0 to 180.');return}
  const side=counter.turn,before=side===0?counter.s1:counter.s2;
  if(n>before){alert('That score is higher than the remaining score. Use BUST if the visit is invalid.');return}
  const checkout=n===before;
  counter.history.push({player:side,score:n,checkout,checkoutAttempt:before<=170});
  if(side===0)counter.s1-=n;else counter.s2-=n;
  pendingScore='';
  if(checkout){
    if(counterMatch?.tournament){finishCounterMatch(side);return}
    counter.started=false;save();renderCounter();return;
  }
  counter.turn=side===0?1:0;renderCounter();
}
function checkoutText(n){const map={170:'T20 T20 Bull',167:'T20 T19 Bull',164:'T20 T18 Bull',161:'T20 T17 Bull',160:'T20 T20 D20',158:'T20 T20 D19',157:'T20 T19 D20',156:'T20 T20 D18',155:'T20 T19 D19',154:'T20 T18 D20',153:'T20 T19 D18',152:'T20 T20 D16',151:'T20 T17 D20',150:'T20 T18 D18',140:'T20 T20 D10',130:'T20 T20 D5',120:'T20 T20 D10',110:'T20 T18 D18',100:'T20 D20',90:'T20 D15',80:'T20 D10',70:'T18 D8',60:'S20 D20',50:'Bull',40:'D20',32:'D16',24:'D12',20:'D10',16:'D8',12:'D6',10:'D5',8:'D4',6:'D3',4:'D2',2:'D1'};return map[n]||'Setup for next dart'}

function allLeagueResults(){return [...(state.archive||[]).flatMap(a=>a.results||[]),...(state.results||[])]}
function playerDartStats(name){
  const hist=(state.dartMatches||[]).map(m=>m.stats?.[name]).filter(Boolean);
  const visits=hist.reduce((a,x)=>a+(x.visits||0),0),points=hist.reduce((a,x)=>a+(x.points||0),0),first9Visits=hist.reduce((a,x)=>a+(x.first9Visits||0),0),first9Points=hist.reduce((a,x)=>a+(x.first9Points||0),0),attempts=hist.reduce((a,x)=>a+(x.checkoutAttempts||0),0),hits=hist.reduce((a,x)=>a+(x.checkoutHits||0),0);
  return {avg:visits?Math.round(points/visits*10)/10:0,first9:first9Visits?Math.round(first9Points/first9Visits*10)/10:0,highestScore:hist.reduce((a,x)=>Math.max(a,x.highestScore||0),0),highestCheckout:hist.reduce((a,x)=>Math.max(a,x.highestCheckout||0),0),oneEighty:hist.reduce((a,x)=>a+(x.oneEighty||0),0),checkoutAttempts:attempts,checkoutHits:hits};
}
function playerStats(name){
  const all=state.results.filter(r=>r.a===name||r.b===name),season=allLeagueResults().filter(r=>r.a===name||r.b===name),wins=all.filter(r=>r.winner===name).length,seasonWins=season.filter(r=>r.winner===name).length,scores=season.map(r=>r.a===name?(r.s1||0):(r.s2||0));
  return {played:all.length,wins,losses:all.length-wins,points:wins*2,winRate:all.length?Math.round(wins/all.length*100):0,seasonPlayed:season.length,seasonWins,seasonLosses:season.length-seasonWins,seasonPoints:seasonWins*2,highestScore:scores.length?Math.max(...scores):0,dart:playerDartStats(name)}
}
function openPlayerProfile(name){
  if(!players.includes(name))return;const v=document.getElementById('view');v.className='show';const s=playerStats(name),recent=state.results.filter(r=>r.a===name||r.b===name).slice().reverse().slice(0,8);v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>👤 ${escapeHtml(name)}</h1><span></span></div><div class="small">PLAYER PROFILE • CURRENT WEEK / SEASON</div><div class="profileGrid"><div class="profileStat"><small>GAMES PLAYED (WEEK)</small><b>${s.played}</b></div><div class="profileStat"><small>POINTS</small><b>${s.points}</b></div><div class="profileStat"><small>WINS</small><b>${s.wins}</b></div><div class="profileStat"><small>LOSSES</small><b>${s.losses}</b></div><div class="profileStat"><small>WIN RATE</small><b>${s.winRate}%</b></div><div class="profileStat"><small>HIGHEST SCORE</small><b>${s.highestScore}</b></div><div class="profileStat"><small>3-DART AVERAGE</small><b>${s.dart.avg||'—'}</b></div><div class="profileStat"><small>FIRST 9 AVG</small><b>${s.dart.first9||'—'}</b></div><div class="profileStat"><small>HIGHEST CHECKOUT</small><b>${s.dart.highestCheckout||'—'}</b></div><div class="profileStat"><small>180s</small><b>${s.dart.oneEighty}</b></div><div class="profileStat"><small>CHECKOUT %</small><b>${s.dart.checkoutAttempts?Math.round(s.dart.checkoutHits/s.dart.checkoutAttempts*100)+'%':'—'}</b></div><div class="profileStat"><small>SEASON GAMES</small><b>${s.seasonPlayed}</b></div><div class="profileStat"><small>SEASON WINS</small><b>${s.seasonWins}</b></div><div class="profileStat"><small>SEASON POINTS</small><b>${s.seasonPoints}</b></div></div><h3>RECENT RESULTS</h3>${recent.length?recent.map(r=>{const opp=r.a===name?r.b:r.a,won=r.winner===name,score=r.a===name?`${r.s1||0} - ${r.s2||0}`:`${r.s2||0} - ${r.s1||0}`;return `<div class="resultRow"><span>vs ${escapeHtml(opp)}</span><b>${won?'WIN':'LOSS'} • ${score}${r.edited?' • EDITED':''}</b></div>`}).join(''):'<p class="small">No completed games yet.</p>'}</div>`;
}
function renderPlayers(){const v=document.getElementById('view');v.className='show';const s=stats();v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>👥 MANAGE PLAYERS</h1><span></span></div><p class="small">Add players to the league, edit names, or remove a player. Removing a player also removes their fixtures and results.</p><div class="controls"><button class="redAction" onclick="addPlayer();return false">＋ ADD PLAYER</button></div>${players.map((p,i)=>`<div class="game"><div><b class="clickPlayer" onclick="openPlayerProfile('${escapeHtml(p)}');return false">${escapeHtml(p)}</b><div class="small">${s[p].p} games • ${s[p].pts} points</div></div><div class="controls"><button class="ghost" onclick="editPlayer(${i});return false">EDIT</button><button class="action" onclick="removePlayer(${i});return false">REMOVE</button></div></div>`).join('')}</div>`}
function addPlayer(){const name=(prompt('Player name?')||'').trim();if(!name)return;if(players.some(p=>p.toLowerCase()===name.toLowerCase())){alert('That player already exists.');return}players.push(name);state.fixtures=fixtures();save();renderPlayers();renderHome()}
function editPlayer(i){
  const old=players[i],name=(prompt('Edit player name:',old)||'').trim();
  if(!name||name===old)return;
  if(players.some((p,j)=>j!==i&&p.toLowerCase()===name.toLowerCase())){alert('That player already exists.');return}
  players[i]=name;
  state.fixtures=state.fixtures.map(f=>{const a=f.a===old?name:f.a,b=f.b===old?name:f.b;return{id:pairId(a,b),a,b}});
  state.results=state.results.map(r=>{const a=r.a===old?name:r.a,b=r.b===old?name:r.b;return{...r,a,b,winner:r.winner===old?name:r.winner,id:pairId(a,b)}});
  state.archive=(state.archive||[]).map(a=>({...a,results:(a.results||[]).map(r=>{const aa=r.a===old?name:r.a,bb=r.b===old?name:r.b;return{...r,a:aa,b:bb,winner:r.winner===old?name:r.winner,id:pairId(aa,bb)}})}));
  state.dartMatches=(state.dartMatches||[]).map(m=>{const p1=m.p1===old?name:m.p1,p2=m.p2===old?name:m.p2,st={...(m.stats||{})};if(m.stats?.[old]){st[name]=m.stats[old];delete st[old]}return{...m,p1,p2,winner:m.winner===old?name:m.winner,stats:st}});
  if(state.tournament){state.tournament.selected=(state.tournament.selected||[]).map(p=>p===old?name:p);state.tournament.players=(state.tournament.players||[]).map(p=>p===old?name:p)}
  save();renderPlayers();renderHome();
}
function removePlayer(i){const name=players[i];if(!confirm(`Remove ${name}? This will remove their fixtures and results.`))return;players.splice(i,1);state.results=state.results.filter(r=>r.a!==name&&r.b!==name);state.fixtures=fixtures();state.live=null;save();renderPlayers();renderHome()}
function renderLeagueView(){const v=document.getElementById('view');v.className='show';const rows=standings();v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>🏆 LEAGUE TABLE</h1><span></span></div>${state.results.some(r=>r.edited)?'<div class="correctionNotice">✏️ <b>RESULT CORRECTED</b> — the standings below include all score changes.</div>':''}<div class="tableScroll"><table class="liveTable"><thead><tr><th>#</th><th>PLAYER</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class="rank ${i<3?'medal':''}">${i<3?["🥇","🥈","🥉"][i]:i+1}</span></td><td><b class="clickPlayer" onclick="openPlayerProfile('${escapeHtml(r.n)}');return false">${escapeHtml(r.n)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table></div><h3>PREVIOUS RESULTS</h3>${state.results.length?state.results.map((r,i)=>`<div class="game"><div><b>${escapeHtml(r.a)} vs ${escapeHtml(r.b)}</b><div class="small">${escapeHtml(r.winner)} won • ${r.s1||0} - ${r.s2||0}${r.edited?` • ✏️ CORRECTED (${r.previousS1??0}-${r.previousS2??0} → ${r.s1||0}-${r.s2||0})`:''}</div></div><div class="controls"><button class="ghost" onclick="editResult(${i});return false">EDIT</button><button class="action" onclick="deleteResult(${i});return false">DELETE</button></div></div>`).join(''):'<p class="small">No completed games yet.</p>'}</div>`}
function openView(type){
  if(type==='tournament'){renderTournament();return} if(type==='counter'){counter.started=false;pendingScore='';renderCounter();return} if(type==='league'){renderLeagueView();return} if(type==='players'){renderPlayers();return}
  const v=document.getElementById('view');v.className='show';let title=type==='today'?'🎯 TODAY\'S GAMES':type==='week'?'📅 FULL WEEK':'📋 RULES';let html=`<div class="panel"><div class="viewHead"><button class="back" onclick="goHome();return false" onpointerup="goHome();return false">‹ BACK</button><h1>${title}</h1><span></span></div>`;
  if(type==='today'){const f=current();if(f)html+=`<div class="game"><b>🔴 LIVE — ${escapeHtml(f.a)} vs ${escapeHtml(f.b)}</b><div class="controls"><button class="action" onclick="finishCurrent(0)">🏆 ${escapeHtml(f.a)} WINS</button><button class="action" onclick="finishCurrent(1)">🏆 ${escapeHtml(f.b)} WINS</button></div></div>`;html+=remaining().map((g,i)=>`<div class="game"><b>${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><button class="action" onclick="startGame('${g.id}')">START</button></div>`).join('')||'<p class="small">All games have been completed.</p>'}
  else if(type==='week'){html+=`<p class="small">League week: Monday to Friday. Today's fixtures reset each day, while league points accumulate until Saturday morning.</p>`+state.fixtures.map((g,i)=>{const r=state.results.find(x=>x.id===g.id);const live=state.live?.id===g.id;return `<div class="game"><b>${i+1}. ${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><span>${live?'🔴 LIVE':r?'Complete':'Not played'}</span></div>`}).join('')+`<h3>ARCHIVED WEEKS</h3>`+(state.archive.length?state.archive.slice().reverse().map(a=>`<div class="game"><b>Week starting ${escapeHtml(a.weekId)}</b><span>${a.results.length} results</span></div>`).join(''):'<p class="small">No previous weeks archived yet.</p>')}
  else html+=`<p class="small"><b>League format</b><br>Each fixture is one game — there are no legs. The winner receives 2 league points and the loser receives 0.</p><p class="small"><b>Weekly cycle</b><br>Today's games reset at the start of each new day. League points accumulate Monday to Friday and stay visible through Friday. On Saturday morning the completed week is archived and the league resets to 0–0 ready for Monday.</p><p class="small"><b>Corrections</b><br>Previous results can be edited or deleted from the League Table screen, and the standings recalculate automatically.</p>`;
  html+='</div>';v.innerHTML=html;
}
function goHome(){document.getElementById('view').className='';renderHome()}
renderHome();
</script>
