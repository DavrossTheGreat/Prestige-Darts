<script>
const KEY='prestige_darts_final_v3';
const DEFAULT_PLAYERS=['Ross','Dan','Josh','Asif','Paul'];
let players=DEFAULT_PLAYERS.slice();
let state=load();
let counter={mode:501,p1:'Josh',p2:'Dan',s1:501,s2:501,turn:0,history:[],started:false};
let counterMatch=null;
let pendingScore='';

function pairId(a,b){return [a,b].sort().join('::')}
function fixtures(){
  const f=[];
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++)f.push({id:pairId(players[i],players[j]),a:players[i],b:players[j]});
  return f;
}
function localDateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function mondayKey(d=new Date()){
  const x=new Date(d); const day=x.getDay(); const diff=day===0?-6:1-day; x.setHours(12,0,0,0); x.setDate(x.getDate()+diff);
  return localDateKey(x);
}
function dateKey(d=new Date()){return localDateKey(d)}
function freshState(){const today=dateKey();return {players:players.slice(),fixtures:fixtures(),results:[],dailyResults:[],dailyDate:today,live:null,weekId:mondayKey(),archive:[],championshipHistory:[],dailyHistory:{},selectedDay:today,tournament:null,dartMatches:[],woodenSpoonHistory:[]}}
function load(){
  try{
    const raw=localStorage.getItem(KEY); const s=raw?JSON.parse(raw):null;
    if(s?.players?.length) players=s.players.slice();
    if(!s)return freshState();
    const currentWeek=mondayKey(),today=dateKey();
    s.players=players.slice();
    s.fixtures=fixtures();
    s.results=Array.isArray(s.results)?s.results:[];
    s.dailyResults=Array.isArray(s.dailyResults)?s.dailyResults:[];
    s.dailyHistory=s.dailyHistory||{};
    s.dailyDate=s.dailyDate||today;
    s.archive=Array.isArray(s.archive)?s.archive:[];
    s.championshipHistory=Array.isArray(s.championshipHistory)?s.championshipHistory:[];
    s.woodenSpoonHistory=Array.isArray(s.woodenSpoonHistory)?s.woodenSpoonHistory:[];
    s.dartMatches=Array.isArray(s.dartMatches)?s.dartMatches:[];
    s.weekId=s.weekId||currentWeek;
    if(s.weekId!==currentWeek){
      if(s.results.length)s.archive.push({weekId:s.weekId,results:s.results.slice(),fixtures:s.fixtures.slice(),savedAt:new Date().toISOString()});
      s.results=[]; s.dailyResults=[]; s.dailyDate=today; s.live=null; s.fixtures=fixtures(); s.tournament=null; s.weekId=currentWeek; s.dailyHistory={};
    }else if(s.dailyDate!==today){
      if(s.dailyDate && s.dailyResults?.length)s.dailyHistory[s.dailyDate]=s.dailyResults.slice();
      s.dailyResults=[]; s.dailyDate=today; s.live=null; s.selectedDay=today;
    }
    const weekStart=currentWeek;
    const validWeekDays=[];
    const wb=new Date(weekStart+'T12:00:00');
    for(let i=0;i<5;i++){const dd=new Date(wb);dd.setDate(wb.getDate()+i);validWeekDays.push(localDateKey(dd));}
    if(!s.selectedDay || !validWeekDays.includes(s.selectedDay)) s.selectedDay=today;
    return s;
  }catch(e){return freshState()}
}
function save(){state.players=players.slice();localStorage.setItem(KEY,JSON.stringify(state))}

function weeklyPositions(){
  return standings().map((r,i)=>({player:r.n,position:i+1,points:r.pts,wins:r.w,played:r.p}));
}
function finalizeWeekIfDue(){
  const now=new Date(), day=now.getDay(), hour=now.getHours();
  if(day!==5 || hour<17) return;
  state.championshipHistory=state.championshipHistory||[];
  const positions=weeklyPositions();
  if(!positions.length || !state.results.length) return;
  const existing=state.championshipHistory.find(x=>x.weekId===state.weekId);
  const spoon=positions[positions.length-1]?.player||null;
  if(existing){
    existing.completedAt=existing.completedAt||now.toISOString();
    existing.champion=positions[0]?.player||null;
    existing.positions=positions;
  }else{
    state.championshipHistory.push({weekId:state.weekId,completedAt:now.toISOString(),champion:positions[0]?.player||null,positions});
  }
  state.woodenSpoonHistory=state.woodenSpoonHistory||[];
  const spoonExisting=state.woodenSpoonHistory.find(x=>x.weekId===state.weekId);
  if(spoon){
    if(spoonExisting){
      spoonExisting.player=spoon;
      spoonExisting.points=positions[positions.length-1]?.points||0;
    }else{
      state.woodenSpoonHistory.push({weekId:state.weekId,player:spoon,points:positions[positions.length-1]?.points||0,completedAt:now.toISOString()});
    }
  }
  save();
}
function positionRecord(name){
  const history=state.championshipHistory||[];
  const counts={};
  history.forEach(w=>(w.positions||[]).forEach(p=>{
    if(p.player===name) counts[p.position]=(counts[p.position]||0)+1;
  }));
  return counts;
}
function medalCount(name,pos){return (positionRecord(name)[pos]||0)}
function renderWoodenSpoonHistory(){
  const v=document.getElementById('view');v.className='show';

  const history=(state.championshipHistory||[]).slice().reverse();
  const totals=players.map(p=>{
    const c=positionRecord(p);
    return {p,gold:c[1]||0,silver:c[2]||0,bronze:c[3]||0};

  <h3>WEEK-BY-WEEK FINISHES</h3>
  ${history.length?history.map((w,i)=>`<div class="historyCard"><b>WEEK ${history.length-i} • ${escapeHtml(w.weekId)}</b><div class="small" style="margin-top:6px">${(w.positions||[]).map(p=>`${p.position===1?'🥇':p.position===2?'🥈':p.position===3?'🥉':p.position+'️⃣'} ${escapeHtml(p.player)} — ${p.points} pts`).join('<br>')}</div></div>`).join(''):'<p class="small">No completed weeks have been recorded yet.</p>'}
  <h3>🥄 WOODEN SPOON HISTORY</h3>

  ${(state.woodenSpoonHistory||[]).slice().reverse().map(w=>`<div class="game"><b>${escapeHtml(w.weekId)}</b><span>${smallSpoonSvg()} ${escapeHtml(w.player)} • ${w.points} pts</span></div>`).join('')||'<p class="small">No wooden spoon has been awarded yet.</p>'}
  </div>`;

function ensureCurrentDay(){
  const today=dateKey(); const cw=mondayKey();
  if(state.weekId!==cw){ if(state.results.length)state.archive.push({weekId:state.weekId,results:state.results.slice(),fixtures:state.fixtures.slice(),savedAt:new Date().toISOString()}); state.results=[];state.dailyResults=[];state.dailyDate=today;state.live=null;state.fixtures=fixtures();state.tournament=null;state.weekId=cw;state.dailyHistory={};state.selectedDay=today;save(); }
  if(state.dailyDate!==today){state.dailyHistory=state.dailyHistory||{}; if(state.dailyDate&&state.dailyResults?.length)state.dailyHistory[state.dailyDate]=state.dailyResults.slice(); state.dailyResults=[];state.dailyDate=today;state.selectedDay=today;state.live=null;save();}
  const wb=new Date(cw+'T12:00:00'); const valid=[]; for(let i=0;i<5;i++){const dd=new Date(wb);dd.setDate(wb.getDate()+i);valid.push(localDateKey(dd));}
  if(!valid.includes(state.selectedDay)) {state.selectedDay=today;save();}
  finalizeWeekIfDue();
}
function remaining(){ensureCurrentDay();const done=new Set(state.dailyResults.map(r=>r.id));if(state.live?.id)done.add(state.live.id);return state.fixtures.filter(f=>!done.has(f.id))}
function allLeagueResults(){ensureCurrentDay();return state.results||[]}
function current(){return state.live?state.fixtures.find(f=>f.id===state.live.id):null}
function startGame(id,gameDate){ensureCurrentDay();if(state.live){alert('A match is already live. Finish or cancel it before starting another game.');return}const dates=weekDates();const selectedDate=gameDate||state.selectedDay||state.dailyDate;if(!dates.includes(selectedDate))return;const f=state.fixtures.find(x=>x.id===id);if(!f)return;const results=dayResults(selectedDate);if(results.some(r=>r.id===id))return;state.live={id,gameDate:selectedDate,s1:0,s2:0,startedAt:new Date().toISOString()};save();renderHome()}
function addScore(side){if(!state.live)return;if(side===0)state.live.s1=(state.live.s1||0)+1;else state.live.s2=(state.live.s2||0)+1;save();renderHome()}
function cancelCurrent(){
  if(!state.live)return;
  const f=current();
  if(confirm(`Cancel the match ${f?f.a+' vs '+f.b:'currently active'}? No result will be recorded.`)){state.live=null;save();renderHome()}
}
function finishCurrent(side){
  ensureCurrentDay(); const f=current(); if(!f)return;
  const gameDate=state.live.gameDate||state.dailyDate;
  const s1=Number(state.live.s1)||0,s2=Number(state.live.s2)||0,createdAt=new Date().toISOString();
  const result={id:f.id,a:f.a,b:f.b,winner:side==='draw'?null:(side===0?f.a:f.b),s1,s2,createdAt,date:gameDate};
  state.results.push(result);
  if(gameDate===state.dailyDate){
    state.dailyResults.push(result);
  }else{
    state.dailyHistory=state.dailyHistory||{};
    state.dailyHistory[gameDate]=state.dailyHistory[gameDate]||[];
    state.dailyHistory[gameDate].push(result);
  }
  state.selectedDay=gameDate;
  state.live=null; finalizeWeekIfDue(); save(); renderHome();
}
function resultMatches(r,id,date){return !!r && r.id===id && String(r.date||'')===String(date||'')}
function getResult(id,date){
  return (state.results||[]).find(r=>resultMatches(r,id,date)) ||
    (date===state.dailyDate?(state.dailyResults||[]).find(r=>resultMatches(r,id,date)):null) ||
    (state.dailyHistory?.[date]||[]).find(r=>resultMatches(r,id,date)) || null;
}
function updateResultEverywhere(corrected){
  state.results=(state.results||[]).map(r=>resultMatches(r,corrected.id,corrected.date)?corrected:r);
  if(String(corrected.date||'')===String(state.dailyDate||'')) state.dailyResults=(state.dailyResults||[]).map(r=>resultMatches(r,corrected.id,corrected.date)?corrected:r);
  if(state.dailyHistory?.[corrected.date]) state.dailyHistory[corrected.date]=state.dailyHistory[corrected.date].map(r=>resultMatches(r,corrected.id,corrected.date)?corrected:r);
}
function removeResultEverywhere(target){
  state.results=(state.results||[]).filter(r=>!resultMatches(r,target.id,target.date));
  if(String(target.date||'')===String(state.dailyDate||'')) state.dailyResults=(state.dailyResults||[]).filter(r=>!resultMatches(r,target.id,target.date));
  if(state.dailyHistory?.[target.date]) state.dailyHistory[target.date]=state.dailyHistory[target.date].filter(r=>!resultMatches(r,target.id,target.date));
}
function editResultByKey(id,date,returnView='league'){
  const r=getResult(id,date); if(!r)return;
  const oldWinner=r.winner,oldS1=Number(r.s1)||0,oldS2=Number(r.s2)||0;
  const s1=Number(prompt(`${r.a}'s corrected final score`,oldS1));
  const s2=Number(prompt(`${r.b}'s corrected final score`,oldS2));
  if(!Number.isFinite(s1)||!Number.isFinite(s2)||s1<0||s2<0||!Number.isInteger(s1)||!Number.isInteger(s2)){alert('Please enter whole-number scores of 0 or more.');return}
  const winner=s1===s2?null:(s1>s2?r.a:r.b);
  const changed=s1!==oldS1||s2!==oldS2||winner!==oldWinner;
  if(!changed){alert('No change was made.');return}
  const corrected={...r,winner,s1,s2,edited:true,editedAt:new Date().toISOString(),previousWinner:oldWinner,previousS1:oldS1,previousS2:oldS2};
  updateResultEverywhere(corrected);
  finalizeWeekIfDue(); save();
  if(returnView==='today')renderTodayDay();else renderLeagueView();
  alert(`Result corrected: ${r.a} ${oldS1}-${oldS2} ${r.b} → ${r.a} ${s1}-${s2} ${r.b}.\n\nThe league table and weekly standings have been recalculated.`);
}
function editResult(index){const r=state.results[index];if(r)editResultByKey(r.id,r.date||'','league');}
function deleteResultByKey(id,date,returnView='league'){
  const r=getResult(id,date); if(!r)return;
  if(!confirm(`Cancel the result for ${r.a} vs ${r.b} (${r.s1||0}-${r.s2||0})? The fixture will become unplayed for that day and the league table will recalculate.`))return;
  removeResultEverywhere(r); finalizeWeekIfDue(); save(); if(returnView==='today')renderTodayDay();else renderLeagueView(); renderHome();
}
function deleteResult(index){const r=state.results[index];if(r)deleteResultByKey(r.id,r.date||'','league');}
function stats(){
  const s={};players.forEach(p=>s[p]={p:0,w:0,d:0,l:0,pts:0});
  for(const r of state.results){if(!s[r.a]||!s[r.b])continue;s[r.a].p++;s[r.b].p++;
    if(r.winner===r.a){s[r.a].w++;s[r.a].pts+=3;s[r.b].l++}else if(r.winner===r.b){s[r.b].w++;s[r.b].pts+=3;s[r.a].l++}else{s[r.a].d++;s[r.b].d++;}
  }return s;
}
function standings(){const s=stats();return players.map(n=>({n,...s[n]})).sort((a,b)=>b.pts-a.pts||b.w-a.w||b.p-a.p||a.n.localeCompare(b.n))}

  state.archive=(state.archive||[]).map(a=>({...a,results:(a.results||[]).map(r=>{const aa=r.a===old?name:r.a,bb=r.b===old?name:r.b;return{...r,a:aa,b:bb,winner:r.winner===old?name:r.winner,id:pairId(aa,bb)}})}));
  state.dartMatches=(state.dartMatches||[]).map(m=>{const p1=m.p1===old?name:m.p1,p2=m.p2===old?name:m.p2,st={...(m.stats||{})};if(m.stats?.[old]){st[name]=m.stats[old];delete st[old]}return{...m,p1,p2,winner:m.winner===old?name:m.winner,stats:st}});
  if(state.tournament){state.tournament.selected=(state.tournament.selected||[]).map(p=>p===old?name:p);state.tournament.players=(state.tournament.players||[]).map(p=>p===old?name:p)}
  save();renderPlayers();renderHome();
}

function renderLeagueView(){
  const v=document.getElementById('view');v.className='show'; const rows=standings();
  const results=(state.results||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const spoon=rows[rows.length-1];
  const spoonRecord=(state.woodenSpoonHistory||[]).find(x=>x.weekId===state.weekId);
  v.innerHTML=`<div class="panel"><div class="viewHead"><button class="ghost" onclick="goHome();return false">‹ BACK</button><h1>🏆 LEAGUE TABLE</h1><span></span></div>${results.some(r=>r.edited)?'<div class="correctionNotice">✏️ <b>RESULT CORRECTED</b> — the standings below include all score changes.</div>':''}<div class="controls"><button class="goldAction" onclick="renderLeagueHistory();return false">🏆 LEAGUE HISTORY / HALL OF FAME</button><button class="goldAction" onclick="renderWoodenSpoonHistory();return false"><span class="buttonSpoonIcon">${smallSpoonSvg()}</span> WOODEN SPOON HISTORY</button></div><div class="tableScroll"><table class="liveTable"><thead><tr><th>#</th><th>PLAYER</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class="rank ${i<3?'medal':i===rows.length-1?'spoon':''}" title="${i===rows.length-1?'Wooden Spoon':''}">${i<3?["🥇","🥈","🥉"][i]:i===rows.length-1?`${smallSpoonSvg()}`:i+1}</span></td><td><b class="clickPlayer" onclick="openPlayerProfile('${escapeHtml(r.n)}');return false">${escapeHtml(r.n)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table></div>
  
  <h3>PREVIOUS RESULTS</h3>${results.length?results.map(r=>`<div class="game"><div><b>${escapeHtml(r.a)} vs ${escapeHtml(r.b)}</b><div class="small">${r.winner?escapeHtml(r.winner)+' won':'Draw'} • ${r.s1||0} - ${r.s2||0}${r.date?` • ${escapeHtml(r.date)}`:''}${r.edited?` • ✏️ CORRECTED (${r.previousS1??0}-${r.previousS2??0} → ${r.s1||0}-${r.s2??0})`:''}</div></div><div class="controls"><button class="ghost" onclick='editResultByKey(${JSON.stringify(r.id)},${JSON.stringify(r.date||'')});return false'>EDIT</button><button class="action" onclick='deleteResultByKey(${JSON.stringify(r.id)},${JSON.stringify(r.date||'')});return false'>CANCEL RESULT</button></div></div>`).join(''):'<p class="small">No completed games yet.</p>'}</div>`;
}

function weekDates(){
  const base=new Date(state.weekId+'T12:00:00');
  const day=base.getDay(); const mondayOffset=day===0?-6:1-day; base.setDate(base.getDate()+mondayOffset);
  const out=[]; for(let i=0;i<5;i++){const d=new Date(base);d.setDate(base.getDate()+i);out.push(dateKeyFrom(d));} return out;
}
function dateKeyFrom(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dayName(k){return new Date(k+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'});}
function dayResults(k){ensureCurrentDay(); if(k===state.dailyDate)return state.dailyResults||[]; return (state.dailyHistory||{})[k]||[];}
function dayRemaining(k){const results=dayResults(k);const done=new Set(results.map(r=>r.id));return state.fixtures.filter(f=>!done.has(f.id)).length;}
function selectLeagueDay(k){state.selectedDay=k;save();openView('today');}
function renderTodayDay(){
  ensureCurrentDay();
  const selected=state.selectedDay||state.dailyDate; const dates=weekDates();
  const currentWeekDay=dates.includes(selected)?selected:state.dailyDate; const results=dayResults(currentWeekDay);
  const isCurrent=currentWeekDay===state.dailyDate; const v=document.getElementById('view');v.className='show';
  let html=`<div class=\"panel\"><div class=\"viewHead\"><button class=\"back\" onclick=\"goHome();return false\">‹ BACK</button><h1>🎯 LEAGUE GAMES</h1><span></span></div>
  <div class=\"dayPicker\">${dates.map(d=>`<button class=\"${d===currentWeekDay?'selectedDay':''}\" onclick=\"selectLeagueDay('${d}');return false\">${dayName(d).slice(0,3)}<small>${d.slice(8,10)}</small></button>`).join('')}</div>
  <p class=\"small\"><b>${dayName(currentWeekDay)}</b> — ${isCurrent?'current day':'previous day'} • <b>${dayRemaining(currentWeekDay)} remaining</b><br>${isCurrent?'Play today’s games as normal.':'You can play or enter any game from this day, even though the day has passed.'}</p>`;
  if(isCurrent && state.live){const f=current();if(f)html+=`<div class=\"game\"><b>🔴 LIVE — ${escapeHtml(f.a)} vs ${escapeHtml(f.b)}</b><div class=\"controls\"><button class=\"action\" onclick=\"finishCurrent(0)\">🏆 ${escapeHtml(f.a)} WINS</button><button class=\"action\" onclick=\"finishCurrent(1)\">🏆 ${escapeHtml(f.b)} WINS</button><button class=\"ghost\" onclick=\"finishCurrent('draw')\">🤝 DRAW • 0 POINTS</button></div></div>`;}
  html+=state.fixtures.map(g=>{const r=results.find(x=>x.id===g.id); if(r)return `<div class=\"game\"><div><b>${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><div class=\"small\">✅ ${r.s1||0} - ${r.s2||0} • ${r.winner?escapeHtml(r.winner)+' won':'Draw'}${r.edited?' • ✏️ CORRECTED':''}</div></div><div class=\"controls\"><button class=\"ghost\" onclick='editResultByKey(${JSON.stringify(r.id)},${JSON.stringify(r.date||currentWeekDay)},"today");return false'>EDIT</button><button class=\"action\" onclick='deleteResultByKey(${JSON.stringify(r.id)},${JSON.stringify(r.date||currentWeekDay)},"today");return false'>CANCEL RESULT</button></div></div>`; return `<div class=\"game\"><b>${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><button class=\"action\" onclick=\"startGame('${escapeHtml(g.id)}','${currentWeekDay}')\">START</button></div>`;}).join('') || '<p class=\"small\">No fixtures available.</p>';
  html+='</div>'; v.innerHTML=html;
}
function openView(type){
  if(type==='tournament'){renderTournament();return} if(type==='counter'){counter.started=false;pendingScore='';renderCounter();return} if(type==='league'){renderLeagueView();return} if(type==='players'){renderPlayers();return}
  const v=document.getElementById('view');v.className='show';let title=type==='today'?'🎯 TODAY\'S GAMES':type==='week'?'📅 FULL WEEK':'📋 RULES';let html=`<div class="panel"><div class="viewHead"><button class="back" onclick="goHome();return false" onpointerup="goHome();return false">‹ BACK</button><h1>${title}</h1><span></span></div>`;
  if(type==='today'){renderTodayDay();return;} 
  else if(type==='week'){html+=`<p class="small">League week: Monday to Friday. Today's fixtures reset each day, while league points accumulate until Saturday morning.</p>`+state.fixtures.map((g,i)=>{const r=state.results.find(x=>x.id===g.id);const live=state.live?.id===g.id;return `<div class="game"><b>${i+1}. ${escapeHtml(g.a)} vs ${escapeHtml(g.b)}</b><span>${live?'🔴 LIVE':r?'Complete':'Not played'}</span></div>`}).join('')+`<h3>ARCHIVED WEEKS</h3>`+(state.archive.length?state.archive.slice().reverse().map(a=>`<div class="game"><b>Week starting ${escapeHtml(a.weekId)}</b><span>${a.results.length} results</span></div>`).join(''):'<p class="small">No previous weeks archived yet.</p>')}
  else html+=`<p class="small"><b>League format</b><br>Each fixture is one game — there are no legs. A win gives 3 league points, a draw gives 0 points to each player, and a loss gives 0 points.</p><p class="small"><b>Weekly cycle</b><br>Today's games reset at the start of each new day. League points accumulate Monday to Friday and stay visible through Friday. On Saturday morning the completed week is archived and the league resets to 0–0 ready for Monday.</p><p class="small"><b>League history</b><br>Friday's final standings are recorded from 5 PM onward. Every player's finishing position is kept, with permanent gold, silver and bronze totals.</p><p class="small"><b>Corrections</b><br>Previous results can be edited or cancelled from the League Table or the selected day, and the standings recalculate automatically.</p>`;
  html+='</div>';v.innerHTML=html;
}
function goHome(){document.getElementById('view').className='';renderHome()}
renderHome();
</script>
